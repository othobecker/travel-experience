<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <h1>Personalizador de texto</h1>
    <form id="formEstilo">
        <label for="campoCor">Cor (nome ou hex):</label> <br><br>
        <input type="text" id="campoCor" placeholder="ex: red o7 #ff0000"> <br><br>

        <label for="campoPadding">Padding (px)</label> <br><br>
        <input type="number" id="campoPadding" placeholder="ex: 10"> <br><br>

        <label for="campoTamanho">Tamanho de letra (px):</label> <br><br>
        <input type="number" id="campoTamanho" placeholder="ex: 20px"> <br><br>
        <button type="submit">Aplicar</button>
    </form>
    <p id="retorno">Esta é a sua mensagem!</p>
</main>

</body>
</html>
